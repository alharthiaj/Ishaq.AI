<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إسحاق لفحص الأضرار</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .upload-btn { background: #3498db; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; }
        .upload-btn:hover { background: #2980b9; }
        #preview { margin-top: 20px; position: relative; display: inline-block; max-width: 100%; }
        #preview img { max-width: 100%; border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        .results { margin-top: 20px; text-align: right; }
        .damage-item { background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 6px; border-right: 4px solid #e74c3c; }
        .loading { display: none; color: #7f8c8d; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 نظام إسحاق للكشف الآلي</h1>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="analyzeImage(this.files[0])">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📷 اختر صورة السيارة</button>
        
        <div id="loading" class="loading">⏳ جاري تحليل الصورة بالذكاء الاصطناعي...</div>
        
        <div id="preview"></div>
        <div id="results" class="results"></div>
    </div>

    <script>
        async function analyzeImage(file) {
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const preview = document.getElementById('preview');
                preview.innerHTML = `<img id="previewImg" src="${e.target.result}">`;
                
                const formData = new FormData();
                formData.append('file', file);
                
                // ملاحظة: سيستبدل المتصفح هذا الرابط تلقائياً برابط Render الخاص بك
                const apiUrl = window.location.origin + '/api/detect';
                
                try {
                    const res = await fetch(apiUrl, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.status === 'success') {
                        setTimeout(() => drawBoxes(data.damages), 100); // انتظار تحميل الصورة
                        showResults(data.damages);
                    }
                } catch (err) {
                    alert('حدث خطأ في الاتصال');
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        }
        
        function drawBoxes(damages) {
            const img = document.getElementById('previewImg');
            if (!img) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            img.parentElement.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const scaleX = img.clientWidth / img.naturalWidth;
            const scaleY = img.clientHeight / img.naturalHeight;
            
            damages.forEach(d => {
                const [x1, y1, x2, y2] = d.bbox;
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 3;
                ctx.strokeRect(x1 * scaleX, y1 * scaleY, (x2 - x1) * scaleX, (y2 - y1) * scaleY);
                
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(`${d.type} (${d.confidence}%)`, x1 * scaleX, y1 * scaleY - 5);
            });
        }
        
        function showResults(damages) {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>✅ الأضرار المكتشفة:</h3>' + 
                damages.map(d => `<div class="damage-item"><strong>${d.type}</strong> <span style="color:#7f8c8d; font-size:14px;">(دقة: ${d.confidence}%)</span></div>`).join('');
        }
    </script>
</body>
</html>
